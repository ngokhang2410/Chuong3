<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LibraryMS v0.1{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
        header { background-color: #1a365d; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; }
        nav a { color: #e2e8f0; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover { color: #ffffff; text-decoration: underline; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .filter-bar { margin-bottom: 20px; padding: 10px; background: #edf2f7; border-radius: 5px; }
        .filter-bar a { margin-right: 10px; text-decoration: none; color: #2b6cb0; font-weight: bold; }
        .filter-bar a.active { color: #e53e3e; text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>📚 LibraryMS v0.1</h1>
        <nav>
            <a href="{{ url_for('index') }}">Trang chủ</a>
            <a href="{{ url_for('books_list') }}">Danh sách sách</a>
            <a href="{{ url_for('api_books') }}" target="_blank">API Sách</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
