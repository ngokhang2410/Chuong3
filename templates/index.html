{% extends "base.html" %}

{% block title %}Trang Chủ - LibraryMS{% endblock %}

{% block content %}
    <h2>Tổng quan thư viện</h2>
    <hr>
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div style="flex: 1; padding: 20px; background: #ebf8ff; border-left: 5px solid #3182ce; border-radius: 5px;">
            <h3>Tổng số đầu sách</h3>
            <p style="font-size: 28px; font-weight: bold; margin: 0; color: #2b6cb0;">{{ total_books|e }}</p>
        </div>
        <div style="flex: 1; padding: 20px; background: #f0fff4; border-left: 5px solid #38a169; border-radius: 5px;">
            <h3>Sách sẵn sàng cho mượn</h3>
            <p style="font-size: 28px; font-weight: bold; margin: 0; color: #276749;">{{ available_books|e }}</p>
        </div>
    </div>
    <br>
    <p><a href="{{ url_for('books_list') }}">👉 Xem danh sách chi tiết tất cả các sách</a></p>
{% endblock %}
